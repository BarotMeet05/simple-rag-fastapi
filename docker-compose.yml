# =============================================================================
# docker-compose.yml
# =============================================================================
# Defines the services needed to run this application locally.
#
# HOW TO USE:
#   Start only the database (Phase 2):
#     docker compose up -d postgres
#
#   Start everything (Phase 19+):
#     docker compose up
#
# WHY Docker Compose?
# -------------------
# Every developer on a team (and every CI/CD environment) gets the EXACT same
# PostgreSQL version, with the EXACT same extensions and configuration.
# No "works on my machine" problems.
#
# Volume persistence:
# -------------------
# The 'postgres_data' named volume persists your database between restarts.
# Without it, all data is lost every time the container stops.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector
  # ---------------------------------------------------------------------------
  postgres:
    # pgvector/pgvector is an official image with pgvector pre-installed.
    # pg17 = PostgreSQL 17
    image: pgvector/pgvector:pg17
    container_name: rag_postgres
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb
    ports:
      # host_port:container_port
      # 5432 is PostgreSQL's default port
      - "5432:5432"
    volumes:
      # Named volume — persists data between container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Docker will poll this command to determine if the service is ready.
      # pg_isready exits 0 when PostgreSQL accepts connections.
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FastAPI backend (Phase 19+ — commented out for now)
  # ---------------------------------------------------------------------------
  # api:
  #   build: .
  #   container_name: rag_api
  #   env_file: .env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8000

# =============================================================================
# Named volumes — managed by Docker, persisted between container restarts
# =============================================================================
volumes:
  postgres_data:
    driver: local
